<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chouhan's Family Tree</title>
    <!-- FamilyTreeJS for professional genealogy layouts -->
    <script src="https://balkan.app/js/FamilyTree.js"></script>
    <style>
        body, html {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
        }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0 0; font-size: 14px; color: #ecf0f1; }
        
        #langToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        #langToggle:hover { background-color: #c0392b; }
        
        #tree {
            width: 100%;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <header>
        <button id="langToggle" onclick="toggleLanguage()">हिंदी में देखें</button>
        <h1 id="mainTitle">Chouhan's Family Tree</h1>
        <p id="subTitle">Panai se aaye Chouhan ki Vanshawali, Gram Sadlipur, Post Ishwardas Pur, Tehsil Dalmau, Zila - Raibarelli, UP</p>
    </header>

    <div id="tree"></div>

    <script>
        window.currentLang = 'en';
        window.gedcomData = null;
        let familyTreeInstance = null;

        const textContent = {
            en: {
                toggleBtn: "हिंदी में देखें",
                title: "Chouhan's Family Tree",
                subTitle: "Panai se aaye Chouhan ki Vanshawali, Gram Sadlipur, Post Ishwardas Pur, Tehsil Dalmau, Zila - Raibarelli, UP",
                unknown: "Unknown"
            },
            hi: {
                toggleBtn: "View in English",
                title: "चौहान परिवार की वंशावली",
                subTitle: "पनई से आए चौहान की वंशावली, ग्राम सदलीपुर, पोस्ट ईश्वरदास पुर, तहसील डलमऊ, ज़िला - रायबरेली, यूपी",
                unknown: "अज्ञात (Unknown)"
            }
        };

        function parseGEDCOMToFamilyTreeJS(data, lang) {
            const lines = data.split('\n');
            const indi = {};
            const fam = {};
            let currentType = null;
            let currentId = null;

            lines.forEach(line => {
                const p = line.trim().split(/\s+/);
                if (p.length < 2) return;
                const level = p[0];

                if (level === '0' && p.length >= 3) {
                    if (p[2] === 'INDI') {
                        currentType = 'INDI';
                        currentId = p[1].replace(/@/g, '');
                        indi[currentId] = { id: currentId, name: '', gender: 'male', pids: [], famc: [] };
                    } else if (p[2] === 'FAM') {
                        currentType = 'FAM';
                        currentId = p[1].replace(/@/g, '');
                        fam[currentId] = { husb: null, wife: null, chil: [] };
                    } else {
                        currentType = null;
                    }
                } else if (currentType === 'INDI') {
                    if (level === '1' && p[1] === 'NAME') {
                        let parsedName = p.slice(2).join(' ').replace(/\//g, '').replace(/"/g, '').trim();
                        if (parsedName !== '') indi[currentId].name = parsedName;
                    }
                    if (level === '1' && p[1] === 'SEX') {
                        indi[currentId].gender = p[2] === 'F' ? 'female' : 'male';
                    }
                    if (level === '1' && p[1] === 'FAMC') {
                        indi[currentId].famc.push(p[2].replace(/@/g, ''));
                    }
                } else if (currentType === 'FAM') {
                    if (level === '1' && p[1] === 'HUSB') fam[currentId].husb = p[2].replace(/@/g, '');
                    if (level === '1' && p[1] === 'WIFE') fam[currentId].wife = p[2].replace(/@/g, '');
                    if (level === '1' && p[1] === 'CHIL') fam[currentId].chil.push(p[2].replace(/@/g, ''));
                }
            });

            const treeData = [];
            for (const id in indi) {
                const person = indi[id];
                
                // Identify the blank names and replace with "Unknown"
                let finalName = person.name;
                if (!finalName || finalName === '') {
                    finalName = textContent[lang].unknown;
                }

                const node = {
                    id: person.id,
                    name: finalName,
                    gender: person.gender,
                    pids: []
                };

                // Link Parents accurately
                if (person.famc.length > 0) {
                    const familyId = person.famc[0];
                    const family = fam[familyId];
                    if (family) {
                        if (family.husb) node.fid = family.husb;
                        if (family.wife) node.mid = family.wife;
                    }
                }

                // Link Spouses accurately
                for (const fId in fam) {
                    const family = fam[fId];
                    if (family.husb === person.id && family.wife) {
                        node.pids.push(family.wife);
                    } else if (family.wife === person.id && family.husb) {
                        node.pids.push(family.husb);
                    }
                }
                
                treeData.push(node);
            }
            return treeData;
        }

        window.renderTree = function() {
            if (!window.gedcomData) return;
            
            const treeData = parseGEDCOMToFamilyTreeJS(window.gedcomData, window.currentLang);
            
            document.getElementById('tree').innerHTML = '';
            
            // Build the professional tree structure
            familyTreeInstance = new FamilyTree(document.getElementById("tree"), {
                mouseScrool: FamilyTree.action.zoom,
                enableSearch: false,
                template: 'john',
                nodeBinding: {
                    field_0: "name"
                },
                nodes: treeData
            });
        };

        window.toggleLanguage = function() {
            window.currentLang = window.currentLang === 'en' ? 'hi' : 'en';
            const langData = textContent[window.currentLang];
            
            document.getElementById('langToggle').innerText = langData.toggleBtn;
            document.getElementById('mainTitle').innerText = langData.title;
            document.getElementById('subTitle').innerText = langData.subTitle;
            
            window.renderTree();
        };

        fetch('tree.ged')
            .then(response => {
                if (!response.ok) throw new Error("Could not find tree.ged");
                return response.text();
            })
            .then(data => {
                window.gedcomData = data;
                window.renderTree();
            })
            .catch(err => {
                document.getElementById('tree').innerHTML = `
                    <div style="padding: 20px; text-align: center; color: red;">
                        <h3>File Missing</h3>
                        <p>Ensure your GEDCOM file is named exactly <b>tree.ged</b> and is uploaded to the same folder as this website.</p>
                    </div>`;
            });
    </script>
</body>
</html>
