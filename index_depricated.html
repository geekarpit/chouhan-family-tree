<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chouhan's Family Tree</title>
    <!-- SVG Pan Zoom for map-like navigation -->
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
        }
        header h1 { margin: 0; font-size: 26px; }
        header p { margin: 5px 0 0 0; font-size: 15px; color: #ecf0f1; }
        .instructions { margin-top: 8px; font-size: 13px; color: #bdc3c7; font-style: italic; }
        
        /* Mobile-Responsive Button Layout */
        #langToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        #langToggle:hover { background-color: #c0392b; }

        @media (max-width: 768px) {
            header {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 15px 10px;
            }
            #langToggle {
                position: static;
                margin-bottom: 15px;
            }
            header h1 { font-size: 22px; }
        }
        
        #graph-container {
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            background: white;
            position: relative;
        }
        .mermaid { width: 100%; height: 100%; }
        .mermaid svg { width: 100% !important; height: 100% !important; }

        /* Interactive Hover Effects for Nodes */
        .node:hover rect {
            stroke: #e74c3c !important;
            stroke-width: 4px !important;
            fill: #fdf2e9 !important;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body>

    <header>
        <button id="langToggle" onclick="toggleLanguage()">हिंदी में देखें</button>
        <h1 id="mainTitle">Chouhan's Family Tree</h1>
        <p id="subTitle">Panai se aaye Chouhan ki Vanshawali, Gram Sadlipur, Post Ishwardas Pur, Tehsil Dalmau, Zila - Raibarelli, UP</p>
        <div class="instructions" id="instructionText">Scroll to zoom, click/touch to drag and explore. Hover over boxes to highlight.</div>
    </header>

    <div id="graph-container">
        <p id="loadingText" style="padding: 20px; text-align: center; font-size: 18px;">Loading family tree data...</p>
    </div>

    <!-- ES Modules for the latest stable Mermaid -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ 
            startOnLoad: false, 
            theme: 'default',
            maxTextSize: 9000000, 
            securityLevel: 'loose' 
        });

        window.currentLang = 'en';
        window.gedcomData = null;

        const textContent = {
            en: {
                toggleBtn: "हिंदी में देखें",
                title: "Chouhan's Family Tree",
                subTitle: "Panai se aaye Chouhan ki Vanshawali, Gram Sadlipur, Post Ishwardas Pur, Tehsil Dalmau, Zila - Raibarelli, UP",
                instructions: "Scroll to zoom, click/touch to drag and explore. Hover over boxes to highlight.",
                loading: "Loading family tree data...",
                unknown: "Unknown"
            },
            hi: {
                toggleBtn: "View in English",
                title: "चौहान परिवार की वंशावली",
                subTitle: "पनई से आए चौहान की वंशावली, ग्राम सदलीपुर, पोस्ट ईश्वरदास पुर, तहसील डलमऊ, ज़िला - रायबरेली, यूपी",
                instructions: "ज़ूम करने के लिए स्क्रॉल करें, नेविगेट करने के लिए खींचें। हाईलाइट करने के लिए बॉक्स पर टच करें।",
                loading: "वंशावली डेटा लोड हो रहा है...",
                unknown: "अज्ञात (Unknown)"
            }
        };

        // Custom Phonetic Engine to translate English names to Hindi
        function englishToHindi(name) {
            if (!name) return "";
            
            // Core Dictionary for common exact matches in your tree
            const dict = {
                "chouhan": "चौहान", "singh": "सिंह", "ji": "जी", "bahadur": "बहादुर",
                "pratap": "प्रताप", "ram": "राम", "bai": "बाई", "rajput": "राजपूत",
                "parihar": "परिहार", "kushwah": "कुशवाह", "dodiya": "डोडिया",
                "arpit": "अर्पित", "harshit": "हर्षित", "abhishek": "अभिषेक", "palak": "पलक",
                "dilip": "दिलीप", "savita": "सविता", "shankar": "शंकर", "rajendra": "राजेन्द्र", 
                "surendra": "सुरेन्द्र", "mahendra": "महेन्द्र", "ajay": "अजय", "vijay": "विजय", 
                "sanjay": "संजय", "jagdish": "जगदीश", "thakur": "ठाकुर", "bhai": "भाई"
            };

            return name.split(' ').map(word => {
                const lower = word.toLowerCase();
                if (dict[lower]) return dict[lower];
                
                // Algorithmic phonetic fallback for unknown names
                let res = lower;
                res = res.replace(/sh/g, 'श').replace(/ch/g, 'च').replace(/kh/g, 'ख')
                         .replace(/gh/g, 'घ').replace(/bh/g, 'भ').replace(/dh/g, 'ध')
                         .replace(/th/g, 'थ').replace(/ph/g, 'फ');
                
                res = res.replace(/a/g, 'ा').replace(/i/g, 'ि').replace(/ee/g, 'ी')
                         .replace(/u/g, 'ु').replace(/oo/g, 'ू').replace(/e/g, 'े')
                         .replace(/o/g, 'ो').replace(/au/g, 'ौ').replace(/y/g, 'य');
                
                res = res.replace(/k/g, 'क').replace(/g/g, 'ग').replace(/j/g, 'ज')
                         .replace(/t/g, 'त').replace(/d/g, 'द').replace(/n/g, 'न')
                         .replace(/p/g, 'प').replace(/b/g, 'ब').replace(/m/g, 'म')
                         .replace(/r/g, 'र').replace(/l/g, 'ल').replace(/v/g, 'व')
                         .replace(/w/g, 'व').replace(/s/g, 'स').replace(/h/g, 'ह');
                         
                // Cleanup leading vowel markers
                res = res.replace(/^ा/, 'अ').replace(/^ि/, 'इ').replace(/^े/, 'ए').replace(/^ो/, 'ओ');
                return res;
            }).join(' ');
        }

        function parseGEDCOM(data, lang) {
            const lines = data.split('\n');
            const indi = {};
            const fam = {};
            let currentType = null;
            let currentId = null;

            lines.forEach(line => {
                const p = line.trim().split(/\s+/);
                if (p.length < 2) return;
                const level = p[0];

                if (level === '0' && p.length >= 3) {
                    if (p[2] === 'INDI') {
                        currentType = 'INDI';
                        currentId = p[1].replace(/@/g, '');
                        indi[currentId] = { name: '', sex: 'M' };
                    } else if (p[2] === 'FAM') {
                        currentType = 'FAM';
                        currentId = p[1].replace(/@/g, '');
                        fam[currentId] = { husb: null, wife: null, chil: [] };
                    } else {
                        currentType = null;
                    }
                } else if (currentType === 'INDI') {
                    if (level === '1' && p[1] === 'NAME') indi[currentId].name = p.slice(2).join(' ').replace(/\//g, '').replace(/"/g, '').trim();
                    if (level === '1' && p[1] === 'SEX') indi[currentId].sex = p[2];
                } else if (currentType === 'FAM') {
                    if (level === '1' && p[1] === 'HUSB') fam[currentId].husb = p[2].replace(/@/g, '');
                    if (level === '1' && p[1] === 'WIFE') fam[currentId].wife = p[2].replace(/@/g, '');
                    if (level === '1' && p[1] === 'CHIL') fam[currentId].chil.push(p[2].replace(/@/g, ''));
                }
            });

            let graph = 'flowchart TD\n';
            graph += 'classDef familyBox fill:#e8f4f8,stroke:#2980b9,stroke-width:2px,color:#2c3e50;\n';
            graph += 'classDef singleBox fill:#f9ebea,stroke:#c0392b,stroke-width:2px,color:#2c3e50;\n';

            const marriedIndividuals = new Set();
            for (const fId in fam) {
                if (fam[fId].husb) marriedIndividuals.add(fam[fId].husb);
                if (fam[fId].wife) marriedIndividuals.add(fam[fId].wife);
            }

            const langData = textContent[lang];

            for (const fId in fam) {
                const f = fam[fId];
                if (!f.husb && !f.wife) continue;

                let hNameRaw = (f.husb && indi[f.husb] && indi[f.husb].name) ? indi[f.husb].name : null;
                let wNameRaw = (f.wife && indi[f.wife] && indi[f.wife].name) ? indi[f.wife].name : null;

                let hName = hNameRaw ? (lang === 'hi' ? englishToHindi(hNameRaw) : hNameRaw) : langData.unknown;
                let wName = wNameRaw ? (lang === 'hi' ? englishToHindi(wNameRaw) : wNameRaw) : langData.unknown;

                let label = "";
                if (f.husb && f.wife) label = `${hName}<br/>━ & ━<br/>${wName}`;
                else if (f.husb) label = `${hName}`;
                else if (f.wife) label = `${wName}`;

                graph += `F_${fId}["${label}"]:::familyBox\n`;
            }

            for (const iId in indi) {
                if (!marriedIndividuals.has(iId)) {
                    let nNameRaw = indi[iId].name || null;
                    let nName = nNameRaw ? (lang === 'hi' ? englishToHindi(nNameRaw) : nNameRaw) : langData.unknown;
                    graph += `I_${iId}["${nName}"]:::singleBox\n`;
                }
            }

            for (const fId in fam) {
                const f = fam[fId];
                f.chil.forEach(childId => {
                    if (marriedIndividuals.has(childId)) {
                        for (const childFamId in fam) {
                            if (fam[childFamId].husb === childId || fam[childFamId].wife === childId) {
                                graph += `F_${fId} --> F_${childFamId}\n`;
                            }
                        }
                    } else {
                        graph += `F_${fId} --> I_${childId}\n`;
                    }
                });
            }
            return graph;
        }

        window.renderTree = async function() {
            if (!window.gedcomData) return;
            
            const graphDef = parseGEDCOM(window.gedcomData, window.currentLang);
            const container = document.getElementById('graph-container');
            
            container.innerHTML = `<div class="mermaid" id="familyGraph">${graphDef}</div>`;
            
            try {
                await mermaid.run({
                    nodes: [document.getElementById('familyGraph')]
                });

                const svgElement = container.querySelector('svg');
                if (svgElement) {
                    svgPanZoom(svgElement, {
                        controlIconsEnabled: true,
                        zoomEnabled: true,
                        panEnabled: true,
                        minZoom: 0.1,
                        maxZoom: 10,
                        fit: true,
                        center: true
                    });
                }
            } catch (err) {
                console.error("Rendering failed:", err);
            }
        };

        window.toggleLanguage = function() {
            window.currentLang = window.currentLang === 'en' ? 'hi' : 'en';
            const langData = textContent[window.currentLang];
            
            document.getElementById('langToggle').innerText = langData.toggleBtn;
            document.getElementById('mainTitle').innerText = langData.title;
            document.getElementById('subTitle').innerText = langData.subTitle;
            document.getElementById('instructionText').innerText = langData.instructions;
            
            window.renderTree();
        };

        fetch('tree.ged')
            .then(response => {
                if (!response.ok) throw new Error("Could not find tree.ged");
                return response.text();
            })
            .then(data => {
                window.gedcomData = data;
                window.renderTree();
            })
            .catch(err => {
                document.getElementById('graph-container').innerHTML = `
                    <div style="padding: 30px; text-align: center; color: #c0392b;">
                        <h2>Error: Cannot Load File</h2>
                        <p>Ensure your GEDCOM file is named exactly <b>tree.ged</b> and is uploaded to GitHub Pages.</p>
                    </div>`;
            });
    </script>
</body>
</html>
